<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="DataLab — ứng dụng tự học Data Science, Deep Learning và LLM trên HomeDroid.">
  <title>DataLab · Không gian học AI & Data Science</title>
  <link rel="stylesheet" href="/styles.css?v=4">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="DataLab, về tổng quan">
      <span class="brand-mark" aria-hidden="true">D</span>
      <span>DataLab</span>
    </a>
    <nav aria-label="Điều hướng chính">
      <a href="#/">Tổng quan</a>
      <a href="#/course">Khóa học</a>
      <a href="#/review">Ôn tập</a>
      <a href="#/settings">Cài đặt</a>
    </nav>
  </header>

  <main id="app" tabindex="-1">
    <section class="loading card"><p>Đang tải không gian học…</p></section>
  </main>

  <dialog id="pair-dialog" aria-labelledby="pair-title">
    <form id="pair-form">
      <p class="eyebrow">Thiết bị mới</p>
      <h1 id="pair-title">Kết nối với DataLab</h1>
      <p class="muted">Nhập pairing key đã cấu hình bí mật trong deployment HomeDroid để đồng bộ tiến độ học tập.</p>
      <label for="pair-key">Pairing key<input id="pair-key" name="key" type="password" autocomplete="off" placeholder="Nhập pairing key (≥ 24 ký tự)…" required></label>
      <p class="error" id="pair-error" role="alert"></p>
      <button class="primary" type="submit">Kết nối thiết bị</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js?v=4"></script>
</body>
</html>
