<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#13231d">
  <meta name="description" content="DataLab — ứng dụng tự học Data Science, Deep Learning và LLM trên HomeDroid.">
  <title>DataLab</title>
  <link rel="stylesheet" href="/styles.css?v=3">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="DataLab, về tổng quan"><span class="brand-mark">D</span><span>DataLab</span></a>
    <nav aria-label="Điều hướng chính">
      <a href="#/">Tổng quan</a>
      <a href="#/course">Khóa học</a>
      <a href="#/review">Ôn tập</a>
      <a href="#/settings">Cài đặt</a>
    </nav>
  </header>

  <main id="app" tabindex="-1">
    <section class="loading card"><p>Đang tải không gian học…</p></section>
  </main>

  <dialog id="pair-dialog" aria-labelledby="pair-title">
    <form id="pair-form">
      <p class="eyebrow">Thiết bị mới</p>
      <h1 id="pair-title">Kết nối với DataLab</h1>
      <p>Nhập pairing key đã cấu hình bí mật trong deployment HomeDroid.</p>
      <label>Pairing key<input id="pair-key" name="key" type="password" autocomplete="off" required></label>
      <p class="error" id="pair-error" role="alert"></p>
      <button class="primary" type="submit">Kết nối</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
